# ===================================================================
# Configurações de Produção (Profile: prod) - PostgreSQL
# ===================================================================

# Conexão com PostgreSQL obtida via variáveis de ambiente
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinica_veterinaria_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações de Pool HikariCP para Produção
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=ClinicaVetProdHikariPool

# JPA / Hibernate em Produção (validate para garantir integridade do schema)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Logs em Produção
logging.level.root=WARN
logging.level.br.com.clinicaveterinaria=INFO
